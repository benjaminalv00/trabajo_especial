jobs:
  - nombre: serie_geotiff
    datetime: 2022-09-21T18:00:00
    productos: [day_convection, true_color]
    componentes_rgb:
      productos: [day_convection, true_color]
      out_dir: componentes/
      filename_pattern: "{producto}_{ts}_{canal}.png"
