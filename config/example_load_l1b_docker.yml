# Igual que example_load_l1b.yml, para correr dentro del contenedor de Docker.
defaults:
  tipo_imagen: L1B
  recorte: [-18.6, -56.45, -79.79, -50.0]  # [latN, latS, lonW, lonE]
  data_dir: /app/data/L1B/
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: prueba_l1b
    datetime: 2018-07-13T15:00:00
    productos: [true_color]
    canales: ["C02", "C03", "C01"]  # bandas que usa true_color
    salidas: [GEOTIFF]
    geotiff_conf:
      producto: true_color
      out_dir: geotiffs/
      filename_pattern: "{producto}_{ts}.tif"  # {ts} = AAAAMMDD_HHMM
