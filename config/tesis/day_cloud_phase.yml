# Tesis: secuencia de Day Cloud Phase Distinction (receta daily_microphysics)
# del 30/08/2025, de 15 a 22 UTC.
# Uso: python main.py --config config/tesis/day_cloud_phase.yml
defaults:
  tipo_imagen: MCMI
  recorte: [-18.6, -56.45, -79.79, -53.0]
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: microfisica_diurna_secuencia
    satelite: GOES19
    rango:
      inicio: 2025-08-30T15:00:00
      fin: 2025-08-30T22:00:00
      paso_minutos: 60
    salidas: [PNG]
    productos: [daily_microphysics]
