# Tesis: incendios en Córdoba del 21/09/2024 (Fire Temperature y Color Real,
# con las componentes R, G y B del Fire Temperature).
# Para la secuencia de la figura (16, 18, 20 y 22 UTC), descomentar `rango`
# y quitar `datetime`.
# Uso: python main.py --config config/tesis/incendios_cordoba.yml
defaults:
  tipo_imagen: MCMI
  recorte: [-28, -35, -67, -61.0]
  #recorte: [-18.6, -56.45, -79.79, -53.0]
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: incendios_cordoba_comp
      # rango:
      #   inicio: 2024-09-21T16:00:00
      #   fin: 2024-09-21T22:00:00
      #   paso_minutos: 120
    datetime: 2024-09-21T16:00:00
    satelite: GOES16
    salidas: [PNG,componentes_rgb]
    productos: [fire_temperature,true_color]
    componentes_rgb_conf:
      productos: [fire_temperature]
      out_dir: componentes_rgb/
      filename_pattern: "{producto}_{ts}_{canal}.png"
      cmap: gray  # o {"R":"Reds","G":"Greens","B":"Blues"}
