# Igual que example.yml, para correr dentro del contenedor de Docker.
# Uso: docker compose run --rm goes-processor --config /app/config/example_docker.yml
defaults:
  tipo_imagen: MCMI
  recorte: [-18.6, -56.45, -79.79, -53.0]  # [latN, latS, lonW, lonE]
  data_dir: /app/data  # carpeta de descargas dentro del contenedor
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: prueba_color_real_nombre
    satelite: GOES19
    datetime: 2025-08-30T15:00:00
    productos: [true_color]

  - nombre: daily_microphysics_1500
    satelite: GOES19
    datetime: 2025-08-30T15:00:00
    productos: [daily_microphysics]
