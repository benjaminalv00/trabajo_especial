defaults:
  tipo_imagen: MCMI
  recorte: [-18.6, -56.45, -79.79, -50.0]
  export:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: serie_geotiff
    rango:
      inicio: 2022-09-21T12:00:00
      fin: 2022-09-21T14:00:00
      paso_minutos: 60
    productos: [day_convection, true_color]
    geotiff:
      producto: day_convection               
      out_dir: geotiffs/
      filename_pattern: "{producto}_{ts}.tif"  # {ts}=YYYYMMDD_HHMM

# ```

# Notas:
# - Si el job tiene varios productos y no indicás geotiff.producto/productos, por defecto exporta solo si hay un único producto en el job.
# - Reusa tu helper save_rgb_geotiff, por lo que la georreferencia sale consistente con x/y e índices f0,f1,c0,c1.# filepath: /home/benjamin/trabajo_especial/config/geotiff_example.yml
