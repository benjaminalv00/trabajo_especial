# Productos L1b (un archivo por banda, en radiancia; el procesador los calibra).
# Usa los archivos que ya estén en data_dir; si faltan, los descarga.
# Uso: python main.py --config config/example_load_l1b.yml
defaults:
  tipo_imagen: L1B
  recorte: [-18.6, -56.45, -79.79, -50.0]  # [latN, latS, lonW, lonE]
  data_dir: data/L1B/
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: prueba_l1b
    datetime: 2018-07-13T18:00:00
    productos: [true_color]
    canales: ["C02", "C03", "C01"]  # bandas que usa true_color
    salidas: [GEOTIFF, COMPONENTES_RGB]
    geotiff_conf:
      producto: true_color
      filename_pattern: "{producto}_{ts}.tif"  # {ts} = AAAAMMDD_HHMM
      out_dir: geotiffs/
    componentes_rgb_conf:
      out_dir: componentes_rgb/
      filename_pattern: "componentes_{ts}_{canal}.tif"
