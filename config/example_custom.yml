# Receta propia: productos definidos en config/custom_recipes/
# (ver docs/CUSTOM_RECIPES.md). Se usan igual que las recetas oficiales.
# Uso: python main.py --config config/example_custom.yml
defaults:
  tipo_imagen: MCMI
  recorte: [-18.6, -56.45, -79.79, -53.0]  # [latN, latS, lonW, lonE]
  png_conf:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: receta_propia
    satelite: GOES19
    datetime: 2025-08-30T15:00:00
    productos: [falso_color, true_color]
