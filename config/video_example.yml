defaults:
  tipo_imagen: MCMI
  recorte: [-18.6, -56.45, -79.79, -50.0]
  export:
    out_dir: salidas/
    shapefile_provincias: shapefiles/provincias/linea_de_limite_070111Line.shp
    show: false

jobs:
  - nombre: serie_daytime_convection
    rango:
        inicio: 2022-09-21T12:00:00
        fin: 2022-09-21T14:00:00
        paso_minutos: 60
    productos: [day_convection]
    video:
      producto: day_convection
      frame_seconds: 1
      #fps: 1                 # o usa frame_seconds: 2.0
      filename: serie_daytime_convection.mp4
      out_dir: videos/
      codec: libx264
      crf: 23
      preset: medium
      pix_fmt: yuv420p

