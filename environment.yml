name: goes-env
channels:
  - conda-forge
dependencies:
  # --- runtime base ---
  - python = 3.11
  - numpy = 2.4.6
  - scipy = 1.17.1
  - pandas = 2.2.3
  - pyarrow = 25.0.0          # requerido por streamlit / pandas
  - pyyaml = 6.0.3
  - tqdm = 4.69.1

  # --- datos GOES (S3 + NetCDF) ---
  - s3fs = 0.4.2
  - boto3 = 1.43.56
  - xarray = 2026.7.0
  - netCDF4 = 1.7.4

  # --- geo / proyecciones ---
  - cartopy = 0.25.0
  - shapely = 2.1.2
  - pyproj = 3.7.2
  - rasterio = 1.4.4
  - gdal = 3.10.3             # entra igual via rasterio; se deja explicito por los CLI

  # --- render y salidas ---
  - matplotlib = 3.11.1
  - pillow = 12.3.0
  - imageio = 2.37.0
  - imageio-ffmpeg = 0.6.0
  - ffmpeg = 8.1.2

  # --- interfaz ---
  - streamlit = 1.59.1

  # --- notebooks ---
  - ipykernel = 7.3.0
  - jupyter = 1.1.1

  # --- dev ---
  - pip = 26.1.2
  - pip:
      - -e .
      - pre-commit == 4.6.1
      - black == 26.5.1
