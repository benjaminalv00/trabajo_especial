name: goes-env
channels:
  - conda-forge
dependencies:
  - python = 3.11
  - s3fs
  - xarray
  - netCDF4
  - boto3
  - matplotlib
  - numpy
  - scipy
  - pandas
  - ipykernel
  - jupyter
  - cartopy
  - shapely
  - rasterio
  - pillow
  - pyproj
  - gdal
  - pyyaml
  - imageio
  - ffmpeg      
  - imageio[ffmpeg]
  - imageio-ffmpeg
  - pyarrow          # 🔹 agregado (necesario para streamlit y pandas recientes)
  - streamlit        # 🔹 agregado (la interfaz web)
  - tqdm
  - pip
  - pip:
      - -e .
      - pre-commit
      - black
