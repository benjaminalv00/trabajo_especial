# Versión del formato de archivo de Docker Compose. '3.8' es una versión moderna y recomendada.
version: '3.8'

# Aquí definimos los 'servicios' o contenedores que forman nuestra aplicación.
services:
  # Le damos un nombre a nuestro servicio, por ejemplo, 'processor'.
  goes-processor:
    # Le decimos a Compose que construya una imagen para este servicio.
    # El '.' significa que debe buscar el Dockerfile en el directorio actual.
    build: .
    # Opcional pero recomendado: le damos un nombre a la imagen que se construirá.
    image: goes-processor
    
    # Aquí replicamos la configuración de los volúmenes (-v) del comando 'docker run'.
    # La sintaxis es "ruta_en_tu_maquina:ruta_en_el_contenedor".
    volumes:
      - ./config:/app/config
      - ./salidas:/app/salidas
      - ./gifs:/app/gifs
      - ./geotiffs:/app/geotiffs
      - ./videos:/app/videos
      - ./componentes:/app/componentes
      - ./componentes_rgb:/app/componentes_rgb
      - ./shapefiles:/app/shapefiles
      - ./data:/app/data  # Mounts the 'data' directory from the host to '/app/data' in the container.
      # Cache de shapefiles de Natural Earth (ver la seccion volumes al final).
      - cartopy-cache:/tmp/.local/share/cartopy

    # Ejecuta el proceso del contenedor con el User ID y Group ID del usuario
    # del host, para que los archivos generados no queden como root.
    # IMPORTANTE: se usa HOST_UID/HOST_GID y no UID/GID porque UID es una
    # variable de solo lectura en bash: `UID=$(id -u) docker compose ...`
    # falla silenciosamente y el contenedor termina corriendo como root.
    # Invocar como: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose ...
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Al correr con un UID que no existe dentro de la imagen, HOME queda sin
    # definir y las librerias que escriben cache (matplotlib, cartopy) fallan
    # con PermissionError sobre '/.local'.
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib

    command: --config /app/config/example_docker.yml

# 🌐 Servicio de interfaz web con Streamlit
  goes-ui:
    image: goes-processor        # usa la misma imagen ya construida
    container_name: goes-ui
    ports:
      - "8501:8501"              # puerto local -> puerto interno
    volumes:
      - ./data:/app/data
      - ./salidas:/app/salidas
      - ./geotiffs:/app/geotiffs
      - ./shapefiles:/app/shapefiles
      - .:/app
      - cartopy-cache:/tmp/.local/share/cartopy
    # Ver la nota en goes-processor sobre HOST_UID/HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib

    entrypoint:
      [
        "/opt/conda/bin/python",  # <-- Ensure the full path is used
        "-m", "streamlit", "run", "app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0"
      ]

# Volumen nombrado para el cache de cartopy. Sin esto, los shapefiles de
# Natural Earth viven solo en la capa escribible del contenedor y se vuelven a
# descargar en cada `docker compose run --rm` y en cada recreacion de goes-ui.
volumes:
  cartopy-cache:
